name: Test Builds

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Get short SHA
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-configuration-cache
        env:
          ANDROID_RELEASE_KEYSTORE: release.jks
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            if [[ "$apk" == *"-arm64-v8a-"* ]]; then
              mv "$apk" "vmusic-test-${{ env.SHORT_SHA }}-arm64-v8a.apk"
            elif [[ "$apk" == *"-armeabi-v7a-"* ]]; then
              mv "$apk" "vmusic-test-${{ env.SHORT_SHA }}-armeabi-v7a.apk"
            else
              mv "$apk" "vmusic-test-${{ env.SHORT_SHA }}.apk"
            fi
          done

      - name: Upload to Telegram
        uses: appleboy/telegram-action@master
        if: env.TELEGRAM_TOKEN != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            VMusic: Test Build (${{ env.SHORT_SHA }})
            Branch: ${{ github.ref_name }}
          document: "app/build/outputs/apk/release/*.apk"
